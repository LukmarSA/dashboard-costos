<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="../js/version-guard.js?v=1"></script>
<link rel="icon" type="image/png" href="../apple-touch-icon-lukmar.png">
<link rel="apple-touch-icon" href="../apple-touch-icon-lukmar.png">
<title>Log de Importaciones · LUKMAR S.A.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/main.css?v=2026.08.11.1">
<style>
  .filtros-bar {
    display:flex; gap:8px; align-items:center; flex-wrap:wrap;
    margin-bottom:1rem; padding:0.75rem 1rem;
    background:var(--blanco); border:1px solid var(--gris-1); border-radius:var(--r);
  }
  .filtros-bar select, .filtros-bar input {
    padding:6px 10px; border:1.5px solid var(--gris-1); border-radius:var(--r);
    font-family:'Montserrat',sans-serif; font-size:12px; color:var(--azul-oscuro);
    outline:none; background:white;
  }
  .filtros-bar input { width:220px; }
  .stats-row { display:grid; grid-template-columns:repeat(4,1fr); gap:1rem; margin-bottom:1.25rem; }
</style>
</head>
<body>
<div class="layout">
  <div id="sidebar-mount"></div>
  <main class="main">

    <div class="topbar">
      <div class="topbar-brand">
        <img class="topbar-logo" src="../Icono_EQ.png" alt="EQ">
        <div class="topbar-left">
          <div class="topbar-title">Log de importaciones</div>
          <div class="topbar-sub">Historial de cargas de siembra y costos · LUKMAR S.A.</div>
        </div>
      </div>
      <div class="topbar-right">
        <button class="btn" onclick="cargarLog()">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 8a6 6 0 1 1 2 4.5"/><path d="M2 4v4h4"/></svg>
          Actualizar
        </button>
      </div>
    </div>

    <div class="content">

      <!-- Stats -->
      <div class="stats-row">
        <div class="kpi-card c-azul"><div class="kpi-label">Importaciones</div><div class="kpi-val" id="st-total">—</div><div class="kpi-sub">en el historial</div></div>
        <div class="kpi-card c-verde"><div class="kpi-label">Exitosas</div><div class="kpi-val" id="st-ok">—</div><div class="kpi-sub">estado OK</div></div>
        <div class="kpi-card c-amarillo"><div class="kpi-label">Parciales</div><div class="kpi-val" id="st-parcial">—</div><div class="kpi-sub">con omitidos</div></div>
        <div class="kpi-card c-rojo"><div class="kpi-label">Con error</div><div class="kpi-val" id="st-error">—</div><div class="kpi-sub">fallidas</div></div>
      </div>

      <!-- Filtros -->
      <div class="filtros-bar">
        <input type="text" id="filtro-archivo" placeholder="Buscar por archivo…" oninput="filtrar()">
        <select id="filtro-tipo" onchange="filtrar()">
          <option value="">Todos los tipos</option>
          <option value="siembra">Siembra</option>
          <option value="costos">Costos</option>
        </select>
        <select id="filtro-estado" onchange="filtrar()">
          <option value="">Todos los estados</option>
          <option value="ok">OK</option>
          <option value="parcial">Parcial</option>
          <option value="error">Error</option>
        </select>
        <span style="margin-left:auto;font-size:11px;color:var(--gris-3)" id="lbl-total"></span>
      </div>

      <!-- Tabla -->
      <div class="tabla-card">
        <div style="overflow-x:auto">
          <table>
            <thead>
              <tr>
                <th style="width:160px">Fecha y hora</th>
                <th style="width:90px">Tipo</th>
                <th>Archivo</th>
                <th style="width:110px">F. reporte</th>
                <th class="right" style="width:80px">Total</th>
                <th class="right" style="width:70px">OK</th>
                <th class="right" style="width:90px">Omitidos</th>
                <th style="width:90px">Estado</th>
              </tr>
            </thead>
            <tbody id="tabla-body">
              <tr><td colspan="8" style="padding:2rem;text-align:center;color:var(--gris-3)">Cargando…</td></tr>
            </tbody>
          </table>
        </div>
      </div>

    </div>

    <footer class="app-footer">
      <img src="../Logo_EQ_Horizontal.png" alt="EQSolutions">
      <div class="footer-center">EQ PLATFORM <span>© 2026</span></div>
    </footer>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3"></script>
<script src="../js/config.js?v=2026.08.11.1"></script>
<script src="../js/shared.js?v=2026.08.11.1"></script>
<script>
let _sb;
let _log = [];

(async () => {
  await window.APP_BUILD_READY;
  _sb = getSupabaseClient();
  if (!await verificarSesion(_sb)) return;
  if (!requireRol(['contador', 'admin'])) return;
  renderSidebar('importaciones');
  await cargarLog();
})();

async function cargarLog() {
  const emp = sessionStorage.getItem('dcp_empresa');
  document.getElementById('tabla-body').innerHTML =
    `<tr><td colspan="8" style="padding:2rem;text-align:center;color:var(--gris-3)">Cargando…</td></tr>`;

  const { data, error } = await _sb.from('importaciones_log')
    .select('*')
    .eq('empresa_id', emp)
    .order('created_at', { ascending: false })
    .limit(500);

  if (error) {
    document.getElementById('tabla-body').innerHTML =
      `<tr><td colspan="8" style="padding:2rem;text-align:center;color:var(--rojo)">Error al cargar: ${error.message}</td></tr>`;
    return;
  }

  _log = data || [];
  actualizarStats();
  filtrar();
}

function actualizarStats() {
  const ok      = _log.filter(r => r.estado === 'ok').length;
  const parcial = _log.filter(r => r.estado === 'parcial').length;
  const error   = _log.filter(r => r.estado === 'error').length;
  document.getElementById('st-total').textContent   = _log.length;
  document.getElementById('st-ok').textContent      = ok;
  document.getElementById('st-parcial').textContent = parcial;
  document.getElementById('st-error').textContent   = error;
}

function filtrar() {
  const txt    = document.getElementById('filtro-archivo').value.toLowerCase();
  const tipo   = document.getElementById('filtro-tipo').value;
  const estado = document.getElementById('filtro-estado').value;

  const filtrados = _log.filter(r => {
    if (txt    && !(r.nombre_archivo || '').toLowerCase().includes(txt)) return false;
    if (tipo   && r.tipo !== tipo)     return false;
    if (estado && r.estado !== estado) return false;
    return true;
  });

  document.getElementById('lbl-total').textContent =
    `${filtrados.length} registro${filtrados.length !== 1 ? 's' : ''}`;
  renderTabla(filtrados);
}

function fmtFechaHora(s) {
  if (!s) return '—';
  const d = new Date(s);
  if (isNaN(d)) return '—';
  return d.toLocaleString('es-EC', { day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' });
}

function badgeTipo(t) {
  if (t === 'siembra') return '<span class="badge badge-azul">Siembra</span>';
  if (t === 'costos')  return '<span class="badge badge-naranja">Costos</span>';
  return `<span class="badge badge-gris">${t || '—'}</span>`;
}

function badgeEstado(e) {
  if (e === 'ok')      return '<span class="badge badge-verde">OK</span>';
  if (e === 'parcial') return '<span class="badge badge-amarillo">Parcial</span>';
  if (e === 'error')   return '<span class="badge badge-rojo">Error</span>';
  return `<span class="badge badge-gris">${e || '—'}</span>`;
}

function renderTabla(lista) {
  if (!lista.length) {
    document.getElementById('tabla-body').innerHTML =
      `<tr><td colspan="8" style="padding:2rem;text-align:center;color:var(--gris-3)">Sin importaciones con estos filtros.</td></tr>`;
    return;
  }

  document.getElementById('tabla-body').innerHTML = lista.map(r => {
    const omit = r.registros_omitidos || 0;
    const titleErr = r.detalle_error ? ` title="${String(r.detalle_error).replace(/"/g,'&quot;')}"` : '';
    return `<tr${titleErr}>
      <td style="font-size:12px">${fmtFechaHora(r.created_at)}</td>
      <td>${badgeTipo(r.tipo)}</td>
      <td style="font-size:12px;max-width:340px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" title="${(r.nombre_archivo||'').replace(/"/g,'&quot;')}">${r.nombre_archivo || '—'}</td>
      <td style="font-size:12px">${r.fecha_reporte ? F.date(r.fecha_reporte) : '—'}</td>
      <td class="right">${r.registros_total != null ? F.num(r.registros_total, 0) : '—'}</td>
      <td class="right" style="color:var(--verde);font-weight:600">${r.registros_ok != null ? F.num(r.registros_ok, 0) : '—'}</td>
      <td class="right" style="${omit > 0 ? 'color:var(--naranja);font-weight:600' : 'color:var(--gris-3)'}">${F.num(omit, 0)}</td>
      <td>${badgeEstado(r.estado)}</td>
    </tr>`;
  }).join('');
}
</script>
</body>
</html>
