name: Keep Supabase Alive

on:
  schedule:
    # Se ejecuta a las 12:00 UTC todos los martes y viernes
    - cron: '0 12 * * 2,5'
  workflow_dispatch: # Permite activar el ping manualmente desde la web de GitHub

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Database Table
        run: |
          # IMPORTANTE: Reemplaza "empresas" por el nombre de cualquier tabla que tengas en tu Base de Datos
          curl -i -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/mi_tabla_real?limit=1" \
          -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
